<section class="screen" [class.is-opening]="opening()">
  <div class="glow" aria-hidden="true"></div>

  <p class="eyebrow">Tienes una invitación</p>
  <p class="script">{{ couple().bride }} y {{ couple().groom }}</p>

  <div class="envelope">
    <div class="paper">
      <div class="card">
        <img src="/img/monogram-nh.jpg" alt="Monograma de Nancy y Hugo" />
      </div>
      <div class="flap"></div>
      <button
        type="button"
        class="seal"
        (click)="open()"
        [disabled]="opening()"
        [attr.aria-label]="'Abrir invitación de ' + couple().bride + ' y ' + couple().groom"
      >
        <span class="seal-disk" aria-hidden="true">
          <span class="seal-well">
            <span class="seal-mono">
              <span>N</span>
              <span class="seal-y">y</span>
              <span>H</span>
            </span>
          </span>
        </span>
      </button>
    </div>
  </div>
</section>
