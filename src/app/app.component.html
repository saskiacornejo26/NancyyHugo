<div class="page-bg" aria-hidden="true">
  <video
    class="page-bg-video"
    src="/img/web/fondo1.mp4"
    muted
    autoplay
    loop
    playsinline
    [muted]="true"
    preload="metadata"
  ></video>
</div>
<main class="shell" [class.is-cover]="!opened()" [class.is-open]="opened()">
  <app-invitation [data]="invitation" />
  @if (!opened()) {
    <app-envelope
      class="envelope-layer"
      [couple]="invitation.couple"
      (opened)="openInvitation()"
    />
  }
  @if (opened()) {
    <button
      type="button"
      class="music"
      [class.on]="musicOn()"
      (click)="toggleMusic()"
      [attr.aria-label]="musicOn() ? 'Pausar música' : 'Reproducir música'"
    >
      <span class="disc"></span>
      <small>{{ musicOn() ? 'Pausar' : invitation.musicTitle }}</small>
    </button>
  }
</main>
